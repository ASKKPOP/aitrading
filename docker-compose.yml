# Sooppiy — ONE compose file for dev and prod, ZERO hardcoded values.
#
# Every port, image, tag, path and flag is interpolated from the .env sitting
# next to this file (compose reads it automatically). Values marked :? fail
# loudly when missing — a deploy with a half-filled .env must not guess.
#
#   Local dev:  cp .env.example .env
#               docker compose --profile dev up --build
#     backend  → http://localhost:${SOOPPIY_BACKEND_INTERNAL_PORT}
#     frontend → http://localhost:${SOOPPIY_FRONTEND_DEV_PORT} (Vite, proxies /api)
#
#   Production (sooppiy.com box, /home/ec2-user/sooppiy):
#               docker compose --profile prod up -d
#     .env there sets SOOPPIY_BUILD_CONTEXT=./app, publishes on 127.0.0.1
#     behind host nginx, and runs worker + admin as separate containers.
#
# Whether the API container also runs the background loops is decided by
# SOOPPIY_API_BACKGROUND_TASKS in .env (dev: true, prod: false — the worker
# owns the loops there). It is deliberately NOT set inline here.

services:
  backend:
    build:
      context: ${SOOPPIY_BUILD_CONTEXT:?set in .env — "." for dev, "./app" on the prod box}
    image: ${SOOPPIY_IMAGE:?set in .env — e.g. sooppiy-backend:dev}
    container_name: ${SOOPPIY_BACKEND_NAME:?set in .env}
    command: >
      python -m uvicorn --app-dir service/server main:app
      --host 0.0.0.0 --port ${SOOPPIY_BACKEND_INTERNAL_PORT:?set in .env}
    ports:
      - "${SOOPPIY_BACKEND_PUBLISH:?set in .env — e.g. 8001 (dev) or 127.0.0.1:8101 (prod)}:${SOOPPIY_BACKEND_INTERNAL_PORT}"
    env_file:
      - .env
    volumes:
      - sooppiy_data:/app/service/server/data
    restart: unless-stopped

  worker:
    profiles: ["prod"]
    image: ${SOOPPIY_IMAGE}
    container_name: ${SOOPPIY_WORKER_NAME:?set in .env}
    command: python service/server/worker.py
    env_file:
      - .env
    volumes:
      - sooppiy_data:/app/service/server/data
    restart: unless-stopped
    depends_on:
      - backend

  admin:
    profiles: ["prod"]
    image: ${SOOPPIY_ADMIN_IMAGE:?set in .env — e.g. nginx:alpine}
    container_name: ${SOOPPIY_ADMIN_NAME:?set in .env}
    ports:
      - "${SOOPPIY_ADMIN_PUBLISH:?set in .env — e.g. 127.0.0.1:8201}:80"
    volumes:
      - ${SOOPPIY_ADMIN_SITE_DIR:?set in .env}:/usr/share/nginx/html:ro
      - ${SOOPPIY_ADMIN_NGINX_CONF:?set in .env}:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    image: ${SOOPPIY_FRONTEND_NODE_IMAGE:?set in .env — e.g. node:20-bookworm-slim}
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # Vite dev server reaches the backend container by service name.
      - VITE_PROXY_TARGET=${SOOPPIY_FRONTEND_PROXY_TARGET:?set in .env}
    ports:
      - "${SOOPPIY_FRONTEND_DEV_PORT:?set in .env}:${SOOPPIY_FRONTEND_DEV_PORT}"
    volumes:
      - ./service/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  sooppiy_data:
    # Pin the real docker volume name so compose reuses the volume the old
    # `docker run` deployments created instead of project-prefixing a new one.
    name: ${SOOPPIY_DATA_VOLUME:?set in .env — e.g. sooppiy_data}
  frontend_node_modules:
