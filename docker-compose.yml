# Sooppiy — local development stack (Docker-first).
#
#   cp .env.example .env        # then add any provider keys you want (optional)
#   docker compose up --build
#
#   Backend  → http://localhost:8001   FastAPI (Python 3.12)
#   Frontend → http://localhost:3000   Vite dev, proxies /api + /ws to the backend
#
# AWS deploy comes later — this file is only for local development.
services:
  backend:
    build:
      context: .
    image: sooppiy-backend:dev
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      # Local dev: run background loops (prices, market intel, automation)
      # inside the API container. In production run worker.py separately.
      - SOOPPIY_API_BACKGROUND_TASKS=true
    volumes:
      - sooppiy_data:/app/service/server/data
    restart: unless-stopped

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # Lets the Vite dev server reach the backend container by service name.
      - VITE_PROXY_TARGET=http://backend:8001
    ports:
      - "3000:3000"
    volumes:
      - ./service/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  sooppiy_data:
  frontend_node_modules:
