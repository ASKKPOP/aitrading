<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sooppiy — Guide &amp; Research</title>
<style>
:root{
  --page:#f9f9f7; --surface:#f1f0ec; --card:#fff; --grid:#e1e0d9;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --accent:#2a78d6;
  --border:rgba(11,11,11,.1);
}
@media (prefers-color-scheme: dark){
  :root{ --page:#0d0d0d; --surface:#1a1a19; --card:#202020; --grid:#2c2c2a;
    --ink:#fff; --ink2:#c3c2b7; --accent:#3987e5; --border:rgba(255,255,255,.1); }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
  display:flex;flex-direction:column}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--grid);background:var(--surface);flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand a{color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
.menu{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.menu button{border:1px solid var(--border);background:var(--card);color:var(--ink2);
  font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 13px;cursor:pointer;
  font-family:inherit;white-space:nowrap}
.menu button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.menu button:hover:not(.active){color:var(--ink)}
.lang{display:flex;gap:2px;border:1px solid var(--border);border-radius:999px;
  overflow:hidden;background:var(--card)}
.lang button{border:none;background:transparent;color:var(--muted);font-size:12px;
  font-weight:700;padding:5px 11px;cursor:pointer;font-family:inherit}
.lang button.active{background:var(--accent);color:#fff}
.appLink{font-size:12.5px;color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:600}
/* frame */
#frame{flex:1;width:100%;border:none;background:var(--page)}
/* gate + loading */
.gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{max-width:430px;text-align:center;background:var(--card);
  border:1px solid var(--border);border-radius:16px;padding:38px 34px}
.gate-card .lock{font-size:34px;margin-bottom:10px}
.gate-card h1{font-size:19px;margin-bottom:8px}
.gate-card p{font-size:13.5px;color:var(--ink2);margin-bottom:18px;line-height:1.6}
.gate-card a{display:inline-block;background:var(--accent);color:#fff;font-weight:700;
  font-size:14px;border-radius:10px;padding:10px 26px;text-decoration:none}
.gate-card .sub{font-size:12px;color:var(--muted);margin-top:14px}
.hidden{display:none !important}
.spin{width:26px;height:26px;border:3px solid var(--grid);border-top-color:var(--accent);
  border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="bar hidden" id="bar">
  <div class="brand"><a href="/">Soo<span>ppiy</span> · Docs</a></div>
  <nav class="menu" id="menu" aria-label="documents"></nav>
  <div class="lang" id="lang" role="group" aria-label="language">
    <button data-lang="ko">KO</button>
    <button data-lang="en">EN</button>
  </div>
  <a class="appLink" href="/">← App</a>
</div>

<div class="gate" id="loading"><div class="spin" role="status" aria-label="loading"></div></div>

<div class="gate hidden" id="gate">
  <div class="gate-card">
    <div class="lock">🔒</div>
    <h1 id="gate-title">로그인이 필요합니다</h1>
    <p id="gate-body">가이드와 리서치 문서는 Sooppiy 회원에게만 제공됩니다.<br>로그인 후 이 페이지를 다시 열어주세요.</p>
    <a href="/login" id="gate-btn">로그인</a>
    <div class="sub" id="gate-sub">Login required — the guide and research documents are members-only. Sign in, then reopen this page.</div>
  </div>
</div>

<iframe id="frame" class="hidden" title="document"></iframe>

<script>
(function () {
  'use strict';
  var API = '/api/guide';
  var $ = function (id) { return document.getElementById(id); };
  var state = { manifest: null, current: null, lang: null, cache: {} };

  function token() {
    return localStorage.getItem('claw_token') || localStorage.getItem('sooppiy_user_token') || '';
  }
  function preferredLang() {
    var l = localStorage.getItem('sooppiy_guide_lang') || localStorage.getItem('sooppiy_language') || 'ko';
    return l === 'en' ? 'en' : (l === 'ko' ? 'ko' : 'en'); // docs exist in ko/en; others read en
  }
  function showGate() {
    $('loading').classList.add('hidden');
    $('bar').classList.add('hidden');
    $('frame').classList.add('hidden');
    $('gate').classList.remove('hidden');
  }
  function groupLabel(g) {
    return (state.lang === 'ko' ? g.ko : g.en) || g.en;
  }
  function docFor(group, lang) {
    var docs = state.manifest.docs.filter(function (d) { return d.group === group; });
    return docs.find(function (d) { return d.lang === lang; }) || docs[0] || null;
  }
  function buildMenu() {
    var menu = $('menu');
    menu.innerHTML = '';
    state.manifest.groups.forEach(function (g) {
      if (!docFor(g.group, state.lang)) return;
      var b = document.createElement('button');
      b.textContent = groupLabel(g);
      b.dataset.group = g.group;
      if (state.current && state.current.group === g.group) b.classList.add('active');
      b.onclick = function () { open(g.group); };
      menu.appendChild(b);
    });
    var langBtns = $('lang').querySelectorAll('button');
    langBtns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.lang === state.lang);
      b.onclick = function () {
        state.lang = b.dataset.lang;
        localStorage.setItem('sooppiy_guide_lang', state.lang);
        open(state.current ? state.current.group : 'guide');
      };
    });
  }
  function open(group) {
    var doc = docFor(group, state.lang);
    if (!doc) return;
    state.current = doc;
    buildMenu();
    var hash = '#' + doc.group;
    if (location.hash !== hash) history.replaceState(null, '', hash);
    if (state.cache[doc.key]) { render(state.cache[doc.key]); return; }
    $('frame').classList.add('hidden');
    $('loading').classList.remove('hidden');
    fetch(API + '/doc/' + encodeURIComponent(doc.key), {
      headers: { Authorization: 'Bearer ' + token() }
    }).then(function (r) {
      if (r.status === 401) { showGate(); throw new Error('401'); }
      if (!r.ok) throw new Error('fetch ' + r.status);
      return r.text();
    }).then(function (html) {
      state.cache[doc.key] = html;
      render(html);
    }).catch(function () { /* gate already shown on 401; other errors keep spinner replaced by gate */
      if (!$('gate').classList.contains('hidden')) return;
      showGate();
    });
  }
  function render(html) {
    $('loading').classList.add('hidden');
    $('frame').classList.remove('hidden');
    $('frame').setAttribute('srcdoc', html);
    document.title = 'Sooppiy — ' + state.current.title;
  }

  // boot: verify login by fetching the manifest (content is never in this page)
  if (!token()) { showGate(); return; }
  fetch(API + '/docs', { headers: { Authorization: 'Bearer ' + token() } })
    .then(function (r) {
      if (r.status === 401) { showGate(); throw new Error('401'); }
      if (!r.ok) throw new Error('manifest ' + r.status);
      return r.json();
    })
    .then(function (m) {
      state.manifest = m;
      state.lang = preferredLang();
      $('bar').classList.remove('hidden');
      var initial = (location.hash || '#guide').slice(1);
      var known = m.groups.some(function (g) { return g.group === initial; });
      open(known ? initial : 'guide');
    })
    .catch(function () { showGate(); });
})();
</script>
</body>
</html>
